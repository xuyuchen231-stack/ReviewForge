name: ReviewForge offline quality tests
on:
  push:
    paths:
      - 'reviewforge-runtime/**/*.py'
      - '.github/workflows/reviewforge-quality.yml'
  pull_request:
    paths:
      - 'reviewforge-runtime/**/*.py'
  workflow_dispatch:

jobs:
  offline-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        working-directory: reviewforge-runtime
        run: python -m compileall -q .
      - name: PDF preview test dependency
        working-directory: reviewforge-runtime
        run: python -m pip install -r requirements-preview.txt
      - name: Offline regression tests
        working-directory: reviewforge-runtime
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Quality-system regression tests
        working-directory: reviewforge-runtime
        run: python -m unittest test_quality_system -v
